name: Publish static RIFT build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Tests
        run: npm test

      - name: TypeScript and ESLint
        run: npm run check

      - name: Build
        run: npm run build

      - name: Prepare static build
        run: |
          rm -rf docs
          cp -R dist docs
          sed -i 's|src="/assets/|src="./assets/|g; s|href="/assets/|href="./assets/|g' docs/index.html
          python - <<'PY'
          from pathlib import Path
          root = Path('docs')
          html = (root / 'index.html').read_text()
          css = next((root / 'assets').glob('*.css')).read_text()
          js = next((root / 'assets').glob('*.js')).read_text()
          import re
          html = re.sub(r'\s*<script type="module" crossorigin src="\.\/assets\/[^"]+"><\/script>', '', html)
          html = re.sub(r'\s*<link rel="stylesheet" crossorigin href="\.\/assets\/[^"]+">', f'\n<style>{css}</style>', html)
          html = html.replace('</body>', f'<script type="module">{js}</script>\n</body>')
          (root / 'standalone.html').write_text(html)
          PY
          touch docs/.nojekyll

      - name: Commit static build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Static build already up to date"
            exit 0
          fi
          git commit -m "chore: publish static RIFT build [skip ci]"
          git push origin main
